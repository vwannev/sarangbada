<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F2E8">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>사랑이랑 바다랑</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사랑이랑 바다랑">
<style>
@font-face { font-family: 'Jua'; src: url('fonts/Jua.woff2') format('woff2'); font-display: swap; }
@font-face { font-family: 'Gowun Dodum'; src: url('fonts/Gowun.woff2') format('woff2'); font-display: swap; }
</style>
<style>
/* Layout: one full-screen stage per scene (start, village, game, envelope, album), big touch targets for a 7-year-old on an iPad in landscape. */
/* Deliberately single-theme: a soft picture-book ivory world in both OS themes. */
:root {
  --paper: #F7F2E8;
  --paper-deep: #EFE6D6;
  --sage: #B9C7A5;
  --sage-deep: #8FA27A;
  --sky: #B7CFD9;
  --coral: #E8B4A0;
  --mustard: #E6CC8F;
  --lavender: #C7BBD6;
  --cocoa: #5B4A42;
  --cocoa-soft: #8A776C;
  --card: #FFFDF8;
  --shadow: 0 6px 0 rgba(91, 74, 66, .12);
  --font-display: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--cocoa);
  font-family: var(--font-body);
  font-size: 18px;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font-family: var(--font-display); color: var(--cocoa); cursor: pointer; border: 0; }
button:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; padding-block: 16px; padding-inline: max(16px, 3vw); gap: 14px; overflow-y: auto; }
.scene[hidden] { display: none !important; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border-radius: 999px; padding: 8px 16px; font-family: var(--font-display); font-size: 20px; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.pill .ico { font-size: 22px; line-height: 1; }
.namebtn { background: var(--card); border-radius: 999px; padding: 8px 18px 8px 8px; font-size: 22px; display: inline-flex; align-items: center; gap: 10px; box-shadow: var(--shadow); }
.namebtn .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--card); font-size: 18px; overflow: hidden; border: 3px solid var(--card); }
.namebtn .dot img { width: 100%; height: 100%; object-fit: cover; }
.iconbtn { background: var(--card); border-radius: 999px; width: 52px; height: 52px; font-size: 24px; box-shadow: var(--shadow); display: grid; place-items: center; }

/* start */
#start { align-items: center; justify-content: center; gap: 28px; text-align: center; }
.logo { font-family: var(--font-display); font-size: clamp(44px, 7vw, 76px); letter-spacing: .02em; line-height: 1.1; text-wrap: balance; }
.logo .a { color: #C98A73; } .logo .b { color: #6F98AA; }
.sub { font-size: 20px; color: var(--cocoa-soft); }
.who { display: flex; gap: clamp(16px, 4vw, 48px); flex-wrap: wrap; justify-content: center; }
.kid { width: min(300px, 42vw); min-width: 150px; border-radius: 36px; padding: 18px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 10px 0 rgba(91,74,66,.14); transition: transform .15s; }
.kid:active { transform: translateY(6px); box-shadow: 0 4px 0 rgba(91,74,66,.14); }
.kid.sarang { background: var(--coral); } .kid.bada { background: var(--sky); }
.kid .face { width: 100%; display: block; }
.kid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 26px; background: var(--paper); }
.kid .empty { width: 100%; aspect-ratio: 1; border-radius: 26px; background: var(--paper); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; color: var(--cocoa-soft); }
.kid .nm { font-size: clamp(32px, 4.4vw, 44px); }

/* village */
.village { flex: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: stretch; min-height: 0; }
.hero { position: relative; border-radius: 32px; overflow: hidden; background: var(--paper-deep); min-height: 260px; box-shadow: var(--shadow); }
#hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bubble { position: absolute; left: 18px; right: 18px; bottom: 18px; background: rgba(255,253,248,.94); border-radius: 22px; padding: 14px 18px; font-family: var(--font-display); font-size: clamp(20px, 2.4vw, 26px); line-height: 1.35; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.villname { font-family: var(--font-display); font-size: 30px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.villname small { font-family: var(--font-body); font-size: 17px; color: var(--cocoa-soft); }
.bigbtn { border-radius: 28px; padding: 18px 22px; font-size: clamp(24px, 2.8vw, 30px); display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 0 rgba(91,74,66,.16); text-align: left; transition: transform .12s; }
.bigbtn:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(91,74,66,.16); }
.bigbtn .em { font-size: 40px; line-height: 1; }
.bigbtn .txt { display: flex; flex-direction: column; gap: 2px; }
.bigbtn .txt small { font-family: var(--font-body); font-size: 16px; opacity: .8; }
.bigbtn.play { background: var(--sage); }
.bigbtn.env { background: var(--mustard); }
.bigbtn.alb { background: var(--lavender); }
.bigbtn[disabled] { opacity: .5; filter: grayscale(.4); }
.today { display: flex; gap: 8px; align-items: center; font-size: 17px; color: var(--cocoa-soft); }
.today .t { width: 26px; height: 26px; border-radius: 50%; background: var(--paper-deep); display: grid; place-items: center; font-size: 15px; }
.today .t.on { background: var(--sage-deep); color: var(--card); }

/* game */
#game { gap: 10px; }
.progress { display: flex; gap: 8px; flex: 1; justify-content: center; }
.progress i { width: 18px; height: 18px; border-radius: 50%; background: var(--paper-deep); }
.progress i.done { background: var(--sage-deep); }
.progress i.now { background: var(--mustard); transform: scale(1.2); }
.field { flex: 1; position: relative; border-radius: 32px; overflow: hidden; background: linear-gradient(#D9E6EA 0 45%, #CFDCBB 45% 100%); min-height: 300px; display: flex; flex-direction: column; }
.field .guide { display: flex; align-items: center; gap: 14px; padding: 16px 18px 0; }
.field .guide img { width: clamp(84px, 12vw, 130px); aspect-ratio: 1; border-radius: 50%; object-fit: cover; border: 5px solid var(--card); }
.say { background: var(--card); border-radius: 22px; padding: 12px 18px; font-family: var(--font-display); font-size: clamp(22px, 2.6vw, 30px); display: flex; align-items: center; gap: 12px; }
.listen { background: var(--mustard); border-radius: 999px; padding: 10px 20px; font-size: 24px; box-shadow: 0 5px 0 rgba(91,74,66,.16); }
.carrots { flex: 1; display: flex; justify-content: center; align-items: center; gap: clamp(14px, 3vw, 40px); flex-wrap: wrap; padding: 18px; }
.carrot { position: relative; width: clamp(120px, 17vw, 180px); aspect-ratio: 3 / 4; background: none; padding: 0; transition: transform .15s; }
.carrot svg { width: 100%; height: 100%; overflow: visible; }
.carrot .ch { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-family: var(--font-display); font-size: clamp(54px, 7.5vw, 84px); color: var(--cocoa); line-height: 1; }
.carrot.wrong { animation: shake .45s; }
.carrot.hint .glow { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
.carrot.right { animation: pop .6s forwards; }
.carrot .glow { opacity: 0; }
@keyframes shake { 0%,100% { transform: translateX(0) } 20%,60% { transform: translateX(-10px) } 40%,80% { transform: translateX(10px) } }
@keyframes pulse { 50% { opacity: .35 } }
@keyframes pop { 30% { transform: scale(1.15) translateY(-14px) } 100% { transform: scale(1.05) translateY(-30px); opacity: .0 } }

/* overlay */
.overlay { position: fixed; inset: 0; background: rgba(91,74,66,.35); display: grid; place-items: center; padding: 16px; z-index: 10; }
.overlay[hidden] { display: none !important; }
.sheet { background: var(--card); border-radius: 36px; padding: 26px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; box-shadow: 0 14px 0 rgba(91,74,66,.18); animation: rise .35s ease-out; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 3.4vw, 38px); margin: 0; text-wrap: balance; }
.sheet p { margin: 0; font-size: 20px; color: var(--cocoa-soft); }
.sheet .art { width: min(320px, 70vw); border-radius: 26px; }
.frame { padding: 10px; border-radius: 30px; background: #E9DFCC; }
.frame.shiny { background: var(--mustard); }
.sheet .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.okbtn { background: var(--sage); border-radius: 999px; padding: 14px 34px; font-size: 26px; box-shadow: 0 6px 0 rgba(91,74,66,.16); }
.okbtn.soft { background: var(--paper-deep); font-size: 20px; }
@keyframes rise { from { transform: translateY(24px); opacity: 0 } }

/* envelopes */
.envs { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
.envbtn { width: clamp(130px, 18vw, 180px); aspect-ratio: 4 / 3; background: none; padding: 0; transition: transform .15s; }
.envbtn:active { transform: scale(.95); }
.envbtn svg { width: 100%; height: 100%; }

/* album */
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; padding-bottom: 20px; }
.slot { background: var(--card); border-radius: 24px; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; box-shadow: var(--shadow); }
.slot .pic { width: 100%; aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: var(--paper-deep); display: grid; place-items: center; }
.slot .pic img { width: 100%; height: 100%; object-fit: cover; }
.slot .pic img.sil { filter: blur(14px) grayscale(1) opacity(.45); transform: scale(1.2); }
.slot .lbl { font-family: var(--font-display); font-size: 19px; }
.slot .how { font-size: 15px; color: var(--cocoa-soft); }
.slot .soon { font-size: 40px; opacity: .35; }
.albhead { font-family: var(--font-display); font-size: 30px; }
.count { font-family: var(--font-body); font-size: 18px; color: var(--cocoa-soft); }

/* avatar picker */
.avatars { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.avatar { width: clamp(130px, 17vw, 170px); background: var(--paper); border-radius: 28px; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; font-size: 24px; box-shadow: 0 6px 0 rgba(91,74,66,.14); transition: transform .12s; }
.avatar:active { transform: translateY(4px); }
.avatar.on { background: var(--mustard); }
.avatar img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 20px; }
.sheet.wide { width: min(640px, 100%); }
/* keypad */
.code { display: flex; gap: 12px; }
.code i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--cocoa-soft); }
.code i.on { background: var(--cocoa); border-color: var(--cocoa); }
.keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
.keys button { height: 64px; border-radius: 18px; background: var(--paper-deep); font-size: 28px; }
.small-note { font-size: 15px !important; }
/* parent entry + menu */
.parent-entry { position: absolute; right: max(16px, 3vw); bottom: 16px; background: var(--paper-deep); border-radius: 999px; padding: 10px 18px; font-size: 17px; color: var(--cocoa-soft); overflow: hidden; }
.parent-entry .fill { position: absolute; inset: 0; background: var(--mustard); transform: scaleX(0); transform-origin: left; z-index: 0; }
.parent-entry.holding .fill { transform: scaleX(1); transition: transform 1.5s linear; }
.parent-entry span { position: relative; z-index: 1; }
.parent-entry-hint { position: absolute; right: max(16px, 3vw); bottom: 64px; font-size: 14px; color: var(--cocoa-soft); background: var(--card); border-radius: 12px; padding: 6px 10px; }
.pkids { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; width: 100%; }
.pkid { background: var(--paper); border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.pkid .hd { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 24px; }
.pkid .hd img, .pkid .hd .ph { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--paper-deep); }
.pkid dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 16px; }
.pkid dt { color: var(--cocoa-soft); } .pkid dd { margin: 0; font-variant-numeric: tabular-nums; }
.pkid .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.pkid .acts button { background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 16px; }
.pkid .acts button.danger { color: #9A5A48; }
.seg { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--cocoa-soft); }
.seg .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.seg .opts button { background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
.seg .opts button.on { background: var(--sage); }
.pkid .confirm { background: #F4DED6; border-radius: 16px; padding: 10px; font-size: 15px; display: flex; flex-direction: column; gap: 8px; }

@media (max-width: 760px) {
  .village { grid-template-columns: 1fr; }
  body { overflow: auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}

/* ---------- step 3: villages, mini-games, rewards ---------- */
.hero .ph-hero { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(120px, 18vw, 200px); background: radial-gradient(circle at 50% 40%, var(--card), var(--tint, var(--paper-deep)) 70%); }
.owner-badge { position: absolute; left: 14px; top: 14px; display: flex; align-items: center; gap: 8px; background: rgba(255,253,248,.94); border-radius: 999px; padding: 5px 14px 5px 5px; font-family: var(--font-display); font-size: 18px; }
.owner-badge .o { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--paper-deep); font-size: 26px; }
.owner-badge .o img { width: 100%; height: 100%; object-fit: cover; }
.stars { display: flex; align-items: center; gap: 4px; font-size: 17px; color: var(--cocoa-soft); flex-wrap: wrap; }
.stars b { font-size: 26px; line-height: 1; color: var(--paper-deep); font-weight: 400; }
.stars b.on { color: #D9B45E; }
.stars .grad { background: var(--lavender); color: var(--cocoa); border-radius: 999px; padding: 2px 10px; font-family: var(--font-display); }
.minirow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mini { background: var(--card); border-radius: 22px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 17px; box-shadow: var(--shadow); }
.mini .em { font-size: 30px; line-height: 1.1; }
.bigbtn.rev { background: #D9E3D0; }
.bigbtn.compact { padding: 12px 18px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.duo .bigbtn { font-size: clamp(20px, 2.3vw, 26px); }
.duo .bigbtn .em { font-size: 32px; }
.guide .o { width: clamp(84px, 12vw, 130px); aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--card); background: var(--card); display: grid; place-items: center; font-size: clamp(50px, 7vw, 76px); flex: none; }
.field.tinted { background: linear-gradient(#E3ECEE 0 40%, var(--tint) 40% 100%); }

/* placeholder card (art not drawn yet) */
.ph { width: 100%; height: 100%; aspect-ratio: 1; display: grid; place-items: center; position: relative; background: radial-gradient(circle at 50% 42%, #FFFDF8 0, var(--paper-deep) 75%); }
.ph .pe { font-size: clamp(44px, 6vw, 64px); line-height: 1; }
.ph .pt { position: absolute; right: 10%; bottom: 10%; font-size: clamp(22px, 3vw, 30px); }
.ph.g-s { background: radial-gradient(circle at 50% 42%, #FFFDF8 0, #EFDDB0 75%); }
.ph.g-x { background: radial-gradient(circle at 50% 42%, #FFFDF8 0, #DCD3E6 75%); }
.ph.big { width: min(320px, 70vw); border-radius: 26px; }
.ph.big .pe { font-size: 130px; } .ph.big .pt { font-size: 56px; }
.ph .soonlbl { position: absolute; left: 0; right: 0; top: 8%; text-align: center; font-size: 13px; color: var(--cocoa-soft); }
.frame.special { background: var(--lavender); }
.frame.special > * { animation: float 3s ease-in-out infinite; }
.frame.shiny { box-shadow: 0 0 0 4px #F3E3B6, 0 0 26px rgba(230,204,143,.7); }
@keyframes float { 50% { transform: translateY(-6px) rotate(-1deg) } }
.line { font-family: var(--font-display); font-size: clamp(24px, 3vw, 30px) !important; color: var(--cocoa) !important; }
.line span { opacity: .35; transition: opacity .2s; }
.line span.lit { opacity: 1; }
.cardpair { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.cardpair .frame { width: min(230px, 40vw); }
.cardpair .frame img, .cardpair .frame .ph { width: 100%; border-radius: 20px; display: block; }

/* find tiles (non-carrot villages) */
.tile { position: relative; width: clamp(130px, 18vw, 190px); aspect-ratio: 1; border-radius: 34px; background: var(--card); box-shadow: 0 8px 0 rgba(91,74,66,.16), inset 0 0 0 8px var(--tint); display: grid; place-items: center; transition: transform .15s; padding: 0; }
.tile .prop { position: absolute; top: 10px; left: 14px; font-size: 26px; opacity: .8; }
.tile .ch { font-family: var(--font-display); font-size: clamp(54px, 7.5vw, 84px); line-height: 1; color: var(--cocoa); }
.tile .ch.m { font-size: clamp(40px, 5.4vw, 60px); }
.tile .ch.s { font-size: clamp(30px, 4vw, 44px); }
.carrot .ch.m { font-size: clamp(36px, 5vw, 54px); }
.carrot .ch.s { font-size: clamp(26px, 3.6vw, 40px); }
.tile.wrong { animation: shake .45s; }
.tile.hint { box-shadow: 0 8px 0 rgba(91,74,66,.16), inset 0 0 0 8px var(--mustard), 0 0 0 8px #F6E7B8; animation: pulse 1.1s ease-in-out infinite; }
.tile.right { animation: pop .6s forwards; }

/* build */
.build { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; padding: 16px 18px 18px; align-items: center; }
.house { background: var(--card); border-radius: 30px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: var(--shadow); }
.house .pic { font-size: clamp(64px, 9vw, 96px); line-height: 1; min-height: 1em; }
.house .glyph { font-family: var(--font-display); font-size: clamp(90px, 13vw, 150px); line-height: 1; min-height: 1em; color: var(--cocoa); position: relative; }
.house .glyph .ghost { position: absolute; inset: 0; color: var(--cocoa); opacity: .14; text-align: center; }
.house .glyph.pop { animation: grow .5s; }
@keyframes grow { 40% { transform: scale(1.18) } }
.slots { display: flex; gap: 10px; }
.slot-b { width: clamp(70px, 9vw, 92px); aspect-ratio: 1; border-radius: 20px; border: 4px dashed var(--cocoa-soft); background: var(--paper); font-family: var(--font-display); font-size: clamp(40px, 5vw, 54px); display: grid; place-items: center; padding: 0; position: relative; }
.slot-b small { position: absolute; bottom: -24px; left: 0; right: 0; font-family: var(--font-body); font-size: 14px; color: var(--cocoa-soft); }
.slot-b.c { border-color: var(--sage-deep); } .slot-b.v { border-color: #8EAFBD; }
.slot-b.full { border-style: solid; }
.slot-b.full.c { background: var(--sage); } .slot-b.full.v { background: var(--sky); }
.slot-b.wrong { animation: shake .45s; }
.tray { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-content: center; }
.blk { width: clamp(76px, 10vw, 104px); aspect-ratio: 1; border-radius: 22px; font-size: clamp(44px, 6vw, 62px); box-shadow: 0 7px 0 rgba(91,74,66,.18); display: grid; place-items: center; padding: 0; touch-action: none; }
.blk.c { background: var(--sage); } .blk.v { background: var(--sky); }
.blk.used { visibility: hidden; }
.blk.ghostdrag { position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.08); opacity: .92; }

/* memory */
.mem { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(10px, 1.6vw, 18px); padding: 16px 18px 18px; align-content: center; max-width: 900px; width: 100%; margin: 0 auto; }
.mcard { display: block; aspect-ratio: 4 / 3; border-radius: 22px; padding: 0; background: none; perspective: 700px; }
.mcard .in { display: block; position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.open .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .bk, .mcard .fc { position: absolute; inset: 0; border-radius: 22px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 6px 0 rgba(91,74,66,.16); }

    const score = x => (x.kind === item.kind ? 2 : 0) + ([...parts(x.t)].some(p => p && mine.has(p)) ? 1 : 0) + Math.random() * 0.9 + (Math.abs(x.t.length - item.t.length) < 2 ? .5 : 0);
    const out = [];
    cand.sort((a, b) => score(b) - score(a)).forEach(x => { if (out.length < k && !out.some(o => norm(o.say) === norm(x.say))) out.push(x); });

        <div>${L_END.map(w => `<button class="wcard ${L.end === w ? 'on' : ''}" data-k="end" data-w="${w}">${w}</button>`).join('')}</div></div>
        <button class="okbtn" id="send" ${L.mid && L.end ? '' : 'disabled'}>✉️ 뽀뇽이에게 맡기기</button></div>`;
      $('#board').querySelectorAll('.wcard').forEach(b => b.onclick = () => { L[b.dataset.k] = b.dataset.w; speak(b.dataset.w); draw(); });
      $('#send').onclick = sendLetter;
    };
    draw();
  }
  function sendLetter() {
    const L = G.letter, text = `${vocative(CH[L.to].name)} ${L.mid} ${L.end}`;
    S.letters = [...(S.letters || []), { to: L.to, text, end: L.end, day: today(), replied: false }];
    speak(text); ding(); burstAt($('.paperl'), 20);
    const p = $('.paperl'); p.classList.add('fly');
    G.firstOk = 1; G.note = `뽀뇽이가 편지를 가져갔어요. 내일 ${CH[L.to].name}${josaUi(CH[L.to].name) === '이' ? '이' : '가'} 답장을 보내 줄 거예요!`;
    setTimeout(finishGame, 1600);
  }
  function letterReply(next) {
    const l = (S.letters || []).find(x => !x.replied && x.day < today());
    if (!l) return next();
    l.replied = true; S.acorns += 1; store(); renderVillage();
    const o = CH[l.to], body = `${vocative(kid)}, 편지 고마워! ${L_REPLY[l.end] || '또 만나자!'}`;
    fanfare(); speak(`${o.name}${josaUi(o.name) === '이' ? '이' : '가'} 답장을 보냈어! ${body}`);
    overlay(`<h2>💌 ${o.name}의 답장이 왔어요!</h2><div class="paperl reply"><span class="lto"><span class="o">${ownerPic(l.to)}</span></span><p class="line"></p><span class="lfrom">- ${o.name} -</span></div><p>내가 보낸 편지: "${l.text}"</p><p>도토리 1개도 들어 있었어요.</p><button class="okbtn" id="ok">고마워</button>`,
      s => { readLine(s, { line: body }); s.querySelector('#ok').onclick = () => { closeOverlay(); next(); }; });
  }

  function finishGame() {
    const acc = G.firstOk / G.qs.length;
    G.locked = true;
    $('#progress').innerHTML = Array.from({ length: G.qs.length }, () => '<i class="done"></i>').join('');
    if (G.review) {
      S.acorns += 1; S.reviewDay = today(); store(); fanfare(); speak('복습 끝! 도토리 하나!');
      return overlay(`<h2>복습 끝!</h2><div style="font-size:64px;line-height:1">🌰</div><p>도토리 1개를 받았어요. 지금 ${S.acorns}개!</p><button class="okbtn" id="ok">마을로 가기</button>`,
        s => s.querySelector('#ok').onclick = () => { closeOverlay(); enterVillage(false); });
    }
    const v = V(G.vid), st = vs(v.id);
    S.rounds += 1; S.acorns += 2; st.rounds += 1;
    const bonus = v.bonus || ['story', 'letter'].includes(G.type);
    const star = !bonus && acc >= 0.8 && !st.grad;
    if (star) st.stars = Math.min(GRAD_STARS, st.stars + 1);
    const events = [];
    if (!v.bonus && !st.grad && st.stars >= GRAD_STARS) events.push(next => graduate(v, next));
    const nv = nextVillage(S);
    if (nv && (st.rounds >= UNLOCK_ROUNDS || (st.stars >= GRAD_STARS)) && v.id === S.cur && S.opened.includes(v.id)) events.push(next => unlock(nv, next));
    store();
    fanfare(); speak(star ? '잘했어! 별 하나, 도토리 두 개!' : '잘했어! 도토리 두 개!');
    const envNow = envelopesEarned() - S.envelopes > 0;
    overlay(`<h2>잘했어요!</h2><div style="font-size:64px;line-height:1">🌰🌰${star ? '⭐' : ''}</div><p>도토리 2개를 받았어요. 지금 ${S.acorns}개!</p>
      ${G.note ? `<p>${G.note}</p>` : ''}${star ? `<p>별을 받았어요! 졸업까지 ${GRAD_STARS - st.stars}개 남았어요.</p>` : st.grad || bonus ? '' : '<p>다음 판에 더 많이 맞히면 별을 받아요.</p>'}${envNow ? '<p>오늘의 봉투가 왔어요!</p>' : ''}<button class="okbtn" id="ok">마을로 가기</button>`,
      s => s.querySelector('#ok').onclick = () => { closeOverlay(); enterVillage(false); chain(events); });
  }
  $('#quit-game').addEventListener('click', () => { try { speechSynthesis.cancel(); } catch (e) {} G = null; enterVillage(false); });

  function graduate(v, next) {
    const st = vs(v.id); st.grad = true;
    const g = cardById(`grad-${v.id}`), b = cardById(`buddy-${v.id}`); give(g.id); give(b.id); store(); renderVillage();
    fanfare(); speak(`${kid}${kid === '사랑' ? '아' : '야'}, ${v.name} 졸업 축하해!`);
    overlay(`<h2>🎓 ${v.name} 졸업!</h2><div class="cardpair"><div class="${frameCls(g)}">${pic(g)}</div><div class="${frameCls(b)}">${pic(b)}</div></div><p>졸업 그림과 단짝 친구 그림을 받았어요!</p><button class="okbtn" id="ok">야호!</button>`,
      s => s.querySelector('#ok').onclick = () => { closeOverlay(); next(); });
  }
  function unlock(nv, next) {
    if (S.opened.includes(nv.id)) return next();
    S.opened.push(nv.id); vs(nv.id); store();
    const o = CH[nv.owner];
    fanfare(); speak(`새 마을이 열렸어! ${nv.name}에서 ${o.name}${josaUi(o.name)} 기다리고 있어!`);
    overlay(`<h2>새 마을이 열렸어요!</h2><div style="font-size:96px;line-height:1">${o.em}</div><p>${nv.name}에서 ${o.name}${josaUi(o.name)} 기다려요.<br>${nv.learn}</p>
      <div class="row"><button class="okbtn" id="go">지금 가 볼래요</button><button class="okbtn soft" id="later">나중에</button></div>`,
      s => { s.querySelector('#go').onclick = () => { closeOverlay(); S.cur = nv.id; store(); enterVillage(false); next(); };
             s.querySelector('#later').onclick = () => { closeOverlay(); next(); }; });
  }

  // ---------- today's envelope ----------
  const envelopeSVG = tint => `<svg viewBox="0 0 160 120" aria-hidden="true"><rect x="6" y="14" width="148" height="100" rx="14" fill="${tint}" stroke="#5B4A42" stroke-width="4"/><path d="M8 22 L80 74 L152 22" fill="none" stroke="#5B4A42" stroke-width="4" stroke-linejoin="round"/><circle cx="80" cy="74" r="12" fill="#E8B4A0" stroke="#5B4A42" stroke-width="3"/></svg>`;
  const commonPool = series => CARDS.filter(c => series.includes(c.series) && friendsMet().includes(c.who) && !owned(c.id));
  function openEnvelope() {
    if (envelopesEarned() - S.envelopes <= 0) return;
    speak('봉투 두 개 중에 하나를 골라 봐!');
    overlay(`<h2>오늘의 봉투</h2><p>마음에 드는 봉투를 하나 골라요.</p><div class="envs"><button class="envbtn" data-e="0">${envelopeSVG('#F3E3B6')}</button><button class="envbtn" data-e="1">${envelopeSVG('#DCE6EE')}</button></div>`,
      s => s.querySelectorAll('.envbtn').forEach(b => b.onclick = reveal));
  }
  function reveal() {
    S.envelopes += 1;
    // Drawn pictures come first so the album fills with real art while the rest is being made.
    const left = commonPool(['face', 'day']), drawn = left.filter(c => art(c.id));
    if (!left.length) {
      S.acorns += 5; store(); renderVillage(); ding(); speak('새 그림은 다음 마을에서 만날 수 있어! 도토리 다섯 개!');
      return overlay(`<h2>도토리 5개!</h2><div style="font-size:64px;line-height:1">🌰</div><p>지금 만날 수 있는 그림을 다 모았어요. 새 그림은 다음 마을에서 만날 수 있어요.</p><button class="okbtn" id="ok">좋아요</button>`,
        s => s.querySelector('#ok').onclick = () => { closeOverlay(); renderVillage(); });
    }
    const c = pick(drawn.length ? drawn : left);
    give(c.id); store(); renderVillage(); fanfare();
    overlay(`<h2>${c.name}</h2><div class="${frameCls(c)}">${pic(c, true)}</div><p class="line"></p><p>앨범에 붙였어요!</p><button class="okbtn" id="ok">앨범 보기</button>`,
      s => { setTimeout(() => readLine(s, c), 500); s.querySelector('#ok').onclick = () => { closeOverlay(); openAlbum(); }; });
  }

  // ---------- 도토 가게 ----------
  function openShop() {
    // Pictures already in the album stay on the shelf, marked and set aside at the end, so it's clear they don't need buying.
    const items = CARDS.filter(c => ['face', 'day', 'job'].includes(c.series) && friendsMet().includes(c.who)).sort((a, b) => owned(a.id) - owned(b.id));
    const left = items.filter(c => !owned(c.id)).length;
    speak(S.acorns >= SHOP_PRICE ? '어서 와! 도토리 열 개로 그림 한 장을 고를 수 있어!' : `어서 와! 도토리 열 개를 모으면 그림을 고를 수 있어!`);
    overlay(`<h2>🐿️ 도토 가게</h2><p>도토리 ${SHOP_PRICE}개로 좋아하는 그림 1장을 골라요. 지금 🌰 ${S.acorns}개${S.acorns < SHOP_PRICE ? `, ${SHOP_PRICE - S.acorns}개 더 모아요` : ''}.</p>
      ${left ? '' : '<p>지금 살 수 있는 그림을 다 모았어요!</p>'}
      <div class="shopgrid">${items.map(c => owned(c.id)
        ? `<button class="slot have g-${c.grade}" data-id="${c.id}" data-have="1"><div class="pic">${pic(c)}<span class="havetag">✔ 있어요</span></div><span class="lbl">${c.name}</span></button>`
        : `<button class="slot g-${c.grade}" data-id="${c.id}" ${S.acorns < SHOP_PRICE ? 'disabled' : ''}><div class="pic">${pic(c)}</div><span class="lbl">${c.name}</span><span class="price">🌰 ${SHOP_PRICE}</span></button>`).join('')}</div>
      <button class="okbtn soft" id="no">나가기</button>`,
      s => {
        s.classList.add('wide'); s.querySelector('#no').onclick = closeOverlay;
        s.querySelectorAll('.shopgrid .slot').forEach(b => b.onclick = () => {
          const c = cardById(b.dataset.id);
          if (b.dataset.have) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); return speak(`${c.name}, 이건 벌써 앨범에 있어!`); }
          speak(`${c.name}, 이 그림 살까?`);
          overlay(`<h2>이 그림을 살까요?</h2><div class="${frameCls(c)}">${pic(c, true)}</div><p>${c.name} · 🌰 ${SHOP_PRICE}개</p><div class="row"><button class="okbtn" id="yes">살래요</button><button class="okbtn soft" id="back">다시 고를래요</button></div>`,
            s2 => {
              s2.querySelector('#back').onclick = openShop;
              s2.querySelector('#yes').onclick = () => {
                if (S.acorns < SHOP_PRICE) return;
                S.acorns -= SHOP_PRICE; give(c.id); store(); renderVillage(); fanfare();
                overlay(`<h2>${c.name}</h2><div class="${frameCls(c)}">${pic(c, true)}</div><p class="line"></p><p>앨범에 붙였어요!</p><button class="okbtn" id="ok">좋아요</button>`,
                  s3 => { setTimeout(() => readLine(s3, c), 400); s3.querySelector('#ok').onclick = closeOverlay; });
              };
            });
        });
      });
  }

  // ---------- album ----------
  function slotHTML(c) {
    if (owned(c.id)) return `<button class="slot g-${c.grade}" data-id="${c.id}"><div class="pic">${pic(c)}</div><span class="lbl">${c.short}</span></button>`;
    return `<div class="slot locked"><div class="pic">${art(c.id) ? `<img class="sil" src="${art(c.id)}" alt="">` : '<span class="soon">?</span>'}</div><span class="how">${c.series === 'face' && c.id.endsWith('-laugh') && c.who !== 'ppobyongi' ? '🏡 마을 도착' : HOW[c.series]}</span></div>`;
  }
  function openAlbum() {
    $('#alb-count').textContent = `${S.owned.length} / ${CARDS.length}장`;
    const met = friendsMet(), order = Object.keys(CH);
    const secs = order.filter(w => met.includes(w)).map(w => {
      const cs = CARDS.filter(c => c.who === w && c.series !== 'special');
      return `<div class="albsec"><h3><span class="o">${ownerPic(w)}</span>${CH[w].name} <small>${cs.filter(c => owned(c.id)).length}/${cs.length}장</small></h3><div class="album">${cs.map(slotHTML).join('')}</div></div>`;
    });
    const sp = CARDS.filter(c => c.series === 'special');
    secs.push(`<div class="albsec"><h3><span class="o">🎁</span>특별한 날 <small>${sp.filter(c => owned(c.id)).length}/${sp.length}장</small></h3><div class="album">${sp.map(slotHTML).join('')}</div></div>`);
    const notYet = order.filter(w => !met.includes(w));
    if (notYet.length) secs.push(`<div class="albsec"><h3><span class="o">❔</span>아직 못 만난 친구 <small>${notYet.length}마리, 그림 ${CARDS.filter(c => notYet.includes(c.who) && c.series !== 'special').length}장</small></h3><div class="album">${notYet.map(() => '<div class="slot locked"><div class="pic"><span class="soon">?</span></div><span class="how">🗺️ 새 마을</span></div>').join('')}</div></div>`);
    $('#album-grid').innerHTML = secs.join('');
    $('#album-grid').querySelectorAll('button.slot').forEach(b => b.onclick = () => showCard(cardById(b.dataset.id)));
    show('album');
  }
  function showCard(c, extra = '') {
    overlay(`<h2>${c.name}</h2><div class="${frameCls(c)}">${pic(c, true)}</div><p class="line"></p>${extra}<button class="okbtn" id="ok">닫기</button>`,
      s => { readLine(s, c); const f = s.querySelector('.frame'); bounce(f); burstAt(f, 14); s.querySelector('#ok').onclick = closeOverlay; });
  }
  $('#close-album').addEventListener('click', () => enterVillage(false));

  // ---------- map ----------
  function openMap() {
    $('#map-count').textContent = `${S.opened.length} / ${VILLAGES.length}곳`;
    $('#map-grid').innerHTML = VILLAGES.map((v, i) => {
      const open = S.opened.includes(v.id), st = S.vs[v.id] || freshVil();
      return `<button class="vtile ${open ? '' : 'locked'} ${v.id === S.cur ? 'here' : ''}" data-v="${v.id}" style="--tint:${v.tint}">
        <span class="num">${i + 1}</span><span class="o">${open ? ownerPic(v.owner) : '🔒'}</span><span class="nm">${v.name}</span><span class="lr">${v.learn}</span>
        <span class="st">${open ? (v.bonus ? '📚' : st.grad ? '🎓' : '★'.repeat(st.stars) + '☆'.repeat(GRAD_STARS - st.stars)) : '&nbsp;'}</span></button>`;
    }).join('');
    $('#map-grid').querySelectorAll('.vtile').forEach(b => b.onclick = () => {
      const id = b.dataset.v, go = () => { if (S.opened.includes(S.cur)) S.home = S.cur; S.cur = id; store(); enterVillage(false); };
      if (S.opened.includes(id) || id === S.cur) return go();
      speak('잠긴 마을이야. 엄마 아빠에게 물어봐!');
      codeGate('🔒 잠긴 마을이에요', `${V(id).name}에 이번 한 번만 놀러 갈 수 있어요. 부모님이 인증코드를 눌러 주세요.`, go);
    });
    speak('어느 마을에 갈까?');
    show('map');
  }
  $('#close-map').addEventListener('click', () => enterVillage(false));

  // ---------- my room ----------
  function openRoom() { drawRoom(); show('room'); visit(); }
  function drawRoom() {
    $('#frames').innerHTML = S.frames.map((id, i) => { const c = id && cardById(id); return `<button class="fslot" data-f="${i}" aria-label="액자 ${i + 1}"><span class="in">${c ? pic(c) : '＋'}</span></button>`; }).join('');
    $('#frames').querySelectorAll('.fslot').forEach(b => b.onclick = () => pickFrame(+b.dataset.f));
  }
  function visit(about) {
    const who = pick(friendsMet()), o = CH[who];
    const hung = S.frames.filter(Boolean).map(cardById);
    const c = about || (hung.length ? pick(hung) : null);
    const say = !c ? '그림을 액자에 걸어 줘! 보고 싶어!' : c.who === who ? `우와, 내 그림이다! ${c.line}` : `우와, ${c.name} 그림이다! 멋지다!`;
    $('#visitor').innerHTML = `<span class="o">${ownerPic(who)}</span><div class="say">${o.name}: ${say}</div>`;
    const vo = $('#visitor .o'); bounce(vo); vo.onclick = () => { const t = pick(o.faces); bounce(vo); $('#visitor .say').textContent = `${o.name}: ${t}`; speak(t); };
    speak(say);
  }
  function pickFrame(i) {
    const have = CARDS.filter(c => owned(c.id));
    overlay(`<h2>어떤 그림을 걸까요?</h2>${have.length ? `<div class="shopgrid">${have.map(c => `<button class="slot g-${c.grade}" data-id="${c.id}"><div class="pic">${pic(c)}</div><span class="lbl">${c.short}</span></button>`).join('')}</div>` : '<p>아직 모은 그림이 없어요.</p>'}
      <div class="row">${S.frames[i] ? '<button class="okbtn soft" id="clear">액자 비우기</button>' : ''}<button class="okbtn soft" id="no">닫기</button></div>`,
      s => {
        s.classList.add('wide'); s.querySelector('#no').onclick = closeOverlay;
        const cl = s.querySelector('#clear'); if (cl) cl.onclick = () => { S.frames[i] = null; store(); closeOverlay(); drawRoom(); };
        s.querySelectorAll('.slot').forEach(b => b.onclick = () => { S.frames[i] = b.dataset.id; store(); closeOverlay(); drawRoom(); ding(); visit(cardById(b.dataset.id)); });
      });
  }
  $('#close-room').addEventListener('click', () => enterVillage(false));

  renderStart();
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
